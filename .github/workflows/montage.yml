name: montage
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
concurrency:
  group: montage
  cancel-in-progress: false
jobs:
  montage:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Passe de montage
        env:
          STREAM_FUNCTION_URL: ${{ secrets.STREAM_FUNCTION_URL }}
          MONTAGE_SECRET: ${{ secrets.MONTAGE_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INTRO_DIR: ${{ github.workspace }}
          WORK_DIR: ${{ runner.temp }}/montage
          RUN_ONCE: '1'
        run: node worker.mjs
